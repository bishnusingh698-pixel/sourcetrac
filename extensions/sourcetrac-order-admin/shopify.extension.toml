api_version = "2026-07"

[[extensions]]
name = "SourceTrac order attribution"
handle = "sourcetrac-order-admin"
description = "Shows the survey answer recorded for the order being viewed."
uid = "11af19e5-5dce-4207-9eb4-0cf6bddd4355"
type = "ui_extension"

[extensions.capabilities]
# The block calls our own backend to read the recorded answer.
network_access = true
# Not part of Shopify's schema; documents the host the block calls, asserted
# by check:extensions against API_URL in src/.
allowed_urls = [ "https://sourcetrac.onrender.com/*" ]

[[extensions.targeting]]
module = "./src/OrderAdminBlock.tsx"
target = "admin.order-details.block.render"
