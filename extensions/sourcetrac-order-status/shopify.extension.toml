api_version = "2026-07"

[[extensions]]
name = "SourceTrac survey"
handle = "sourcetrac-survey-order-status"
description = "Asks the customer how they heard about us, then attributes their order to that channel."
uid = "a4d314ed-131c-4826-9804-33b94da63e00"
type = "ui_extension"

[extensions.capabilities]
# Required to POST survey responses to our backend. Without it the extension
# cannot call fetch() at all and the survey would silently never load.
network_access = true
# Must match API_URL in src/OrderStatusBlock.tsx. Without this the manifest
# declares the capability but grants no host, Shopify rejects the fetch at
# runtime, and the survey silently never loads with no visible error.
allowed_urls = [ "https://sourcetrac.onrender.com/*" ]

[[extensions.targeting]]
module = "./src/OrderStatusBlock.tsx"
target = "customer-account.order-status.block.render"