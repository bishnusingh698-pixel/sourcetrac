api_version = "2026-07"

[[extensions]]
name = "SourceTrac survey"
handle = "sourcetrac-survey-order-status"
description = "Asks the customer how they heard about us, then attributes their order to that channel."
uid = "a4d314ed-131c-4826-9804-33b94da63e00"
type = "ui_extension"

[extensions.capabilities]
# Required to POST survey responses to our backend. Without it the extension
# cannot call fetch() at all and the survey would silently never load.
network_access = true
# Not part of Shopify's extension schema: the CLI ignores it, and
# network_access alone allows fetch to any host. Kept so check:extensions can
# assert it names the same host as API_URL in src/, which documents the backend.
allowed_urls = [ "https://sourcetrac.onrender.com/*" ]

[[extensions.targeting]]
module = "./src/OrderStatusBlock.tsx"
target = "customer-account.order-status.block.render"

# Which survey this block shows. Empty: the highest-priority live survey for
# this page. A merchant who runs several surveys pastes one survey's ID here
# (shown on that survey in SourceTrac), and the checkout editor then previews
# that exact survey. Read by the block as `shopify.settings.value.survey_id`.
[extensions.settings]
  [[extensions.settings.fields]]
  key = "survey_id"
  type = "single_line_text_field"
  name = "Survey ID (optional)"
  description = "Leave empty to show your highest-priority live survey. To show one survey here, copy its Survey ID from the survey in SourceTrac and paste it."
    [[extensions.settings.fields.validations]]
    name = "max"
    value = "40"
