# SourceTrac — app configuration
# Docs: https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration

client_id = "f39f9aee3d2f11db2b07386f0a0c5474"
name = "SourceTrac"
handle = "sourcetrac"
application_url = "https://sourcetrac.onrender.com"
embedded = true

# read_orders is the only scope the survey itself needs: order totals arrive by
# webhook and we never mutate an order for Core.
# Phase 7 adds write scopes for optional sync (tag orders/customers, target by
# collection). Every such feature is gated at runtime on the *granted* scopes
# (app/lib/scopes.server.ts), so a merchant who has not re-approved keeps a
# working app with sync simply skipped.
# Declared only under [access_scopes]: the top-level `scopes` key is the legacy
# format and Shopify CLI 4.8.3 rejects the whole file as invalid if it is present.
[access_scopes]
scopes = "read_orders,write_orders,write_customers,read_products"

# Version 2026-07 is the latest stable as of 2026-10-01.
# Keep this in sync with SHOPIFY_API_VERSION and each extension's api_version.
scopes_api_version = "2026-07"

[auth]
redirect_urls = [
  "https://sourcetrac.onrender.com/auth/callback",
  "https://sourcetrac.onrender.com/auth/shopify/callback",
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks"

  # Billing API path. Shopify App Pricing (which stopped sending these on
  # 2026-04-28) would require a Partner API query instead — see docs/01 A12.
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false

# include_config_on_deploy was removed here. Shopify CLI 4.8.3 rejects it as
# unsupported and strips it from the file on every deploy, so keeping it in the
# repo only produced a local edit that never reached git. App configuration is
# now always included on deploy.
